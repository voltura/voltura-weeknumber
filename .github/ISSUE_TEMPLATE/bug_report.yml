name: Bug report
description: Report a reproducible Voltura WeekNumber problem.
title: "[Bug]: "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Voltura WeekNumber. Remove private information from logs and screenshots. Report security vulnerabilities privately using [SECURITY.md](https://github.com/voltura/voltura-weeknumber/blob/master/SECURITY.md).
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Week number or calendar rules
        - Day of year or Julian day lookup
        - Tray icon or notifications
        - Appearance, language, or accessibility
        - Settings or start with Windows
        - Installation or update
        - Other
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Voltura WeekNumber version
      description: Copy the version shown on the About page.
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: Include the version and build shown by winver.
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation type
      options:
        - Standard installer
        - Offline installer (full)
        - Portable ZIP
        - Built from source
        - Not sure
    validations:
      required: true
  - type: textarea
    id: calendar-settings
    attributes:
      label: Calendar and language settings
      description: For date-related problems, include the date or number entered, calendar mode, custom first-day/week rule if used, Windows regional format, and app language.
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Give the shortest repeatable sequence, including the starting state.
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include visible error text when available.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Screenshots and additional context
      description: For display problems, include monitor scaling, monitor layout, and whether reconnecting a display triggers the issue. Attach redacted application or setup logs only when relevant, and say whether restarting the app helps.
